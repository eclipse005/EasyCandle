<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>CandleLab Icon</title>
  <rect width="512" height="512" rx="96" fill="#030303"/>
  <!-- Green bullish candle -->
  <line x1="168" y1="120" x2="168" y2="392" stroke="#06A77D" stroke-width="14" stroke-linecap="round"/>
  <rect x="128" y="176" width="80" height="168" rx="12" fill="#06A77D"/>
  <!-- Red bearish candle -->
  <line x1="344" y1="104" x2="344" y2="408" stroke="#ED6A5A" stroke-width="14" stroke-linecap="round"/>
  <rect x="304" y="152" width="80" height="200" rx="12" fill="#ED6A5A"/>
  <!-- Blue flask neck + rim bridging candles -->
  <path d="M220 148
           C220 118 236 96 256 96
           C276 96 292 118 292 148
           L292 210
           C292 228 278 242 256 242
           C234 242 220 228 220 210 Z"
        fill="none" stroke="#0260FD" stroke-width="22" stroke-linejoin="round"/>
  <path d="M200 96 H312" fill="none" stroke="#0260FD" stroke-width="22" stroke-linecap="round"/>
  <!-- Flask bowl negative space between bodies -->
  <path d="M208 280
           C208 330 228 372 256 372
           C284 372 304 330 304 280
           L304 248 H208 Z"
        fill="none" stroke="#0260FD" stroke-width="18" stroke-linejoin="round" opacity="0.95"/>
</svg>
